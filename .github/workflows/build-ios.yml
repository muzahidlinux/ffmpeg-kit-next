name: Build FFmpegKitNext iOS Device

on:
  workflow_dispatch:
    inputs:
      ffmpegkit_ref:
        description: "ffmpeg-kit-next git ref (branch, tag, or SHA)"
        required: true
        default: "v9.0.0"
      variant:
        description: "Library set (see notes in the PR/chat: full = all LGPL libs, full-gpl = everything incl. x264/x265)"
        type: choice
        default: "full"
        options:
          - min          # FFmpeg + Apple system libs only
          - https        # openssl + common codecs (opus, lame, vpx, webp, dav1d, srt)
          - audio-video  # https + subtitles/fonts/audio extras
          - full         # --enable-lib-all (every non-GPL lib), stays LGPL
          - full-gpl     # --enable-lib-all + GPL libs (x264, x265, xvid, vidstab, rubberband) -> GPL v3
      ios_min:
        description: "Minimum iOS deployment target"
        required: true
        default: "15.0"
      xcode_version:
        description: "Xcode version/range (26.0+ required by ffmpeg-kit-next)"
        required: true
        default: "26"

concurrency:
  # variant is part of the group so two different variants don't cancel each other
  group: ffmpegkit-ios-device-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build-ios-arm64:
    name: iOS arm64 (${{ inputs.variant }})
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      VARIANT: ${{ inputs.variant }}
      IOS_MIN: ${{ inputs.ios_min }}

    steps:
      - name: Select Xcode ${{ inputs.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ inputs.xcode_version }}"

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h /

      - name: Free disk space
        run: |
          # Large library sets (full / full-gpl) need a lot of scratch space.
          sudo rm -rf /Users/runner/Library/Android /Users/runner/hostedtoolcache/* 2>/dev/null || true
          df -h /

      - name: Install host build tools
        run: |
          set -euo pipefail
          brew update
          brew install autoconf automake libtool pkg-config nasm yasm \
            cmake meson ninja gnu-sed gettext doxygen wget xz

          # Extra tools needed by some external libraries (fontconfig, harfbuzz, gmp,
          # libsndfile, Apple's bison is too old). Non-fatal so one missing formula
          # doesn't kill the whole run.
          for pkg in bison gperf ragel texinfo autogen; do
            brew install "$pkg" || echo "::warning::could not install $pkg"
          done

          # ffmpeg-kit-next requires GNU sed (BSD sed is rejected)
          echo "SED=$(brew --prefix gnu-sed)/bin/gsed" >> "$GITHUB_ENV"

          # keg-only formulas: put them on PATH explicitly
          for pkg in gettext bison texinfo; do
            if brew --prefix "$pkg" >/dev/null 2>&1; then
              echo "$(brew --prefix "$pkg")/bin" >> "$GITHUB_PATH"
            fi
          done
          echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal" >> "$GITHUB_ENV"

      - name: Checkout ffmpeg-kit-next
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: ${{ inputs.ffmpegkit_ref }}
          path: ffmpeg-kit-next
          fetch-depth: 1

      - name: Compose ios.sh flags
        run: |
          set -euo pipefail

          # Device-only build: arm64 iPhone/iPad. (No simulator, no Mac Catalyst.)
          ARCH_FLAGS=(
            --disable-arch-arm64-simulator
            --disable-arch-arm64-mac-catalyst
            --disable-arch-arm64e
            --disable-arch-x86-64
            --disable-arch-x86-64-mac-catalyst
          )

          # Apple system frameworks/libs (hardware codecs via VideoToolbox, etc.)
          IOS_LIBS=(
            --enable-lib-ios-videotoolbox
            --enable-lib-ios-audiotoolbox
            --enable-lib-ios-avfoundation
            --enable-lib-ios-bzip2
            --enable-lib-ios-zlib
            --enable-lib-ios-libiconv
          )

          EXTRA=()
          case "$VARIANT" in
            min) ;;
            https)
              EXTRA+=(
                --enable-lib-openssl --enable-lib-dav1d --enable-lib-opus
                --enable-lib-lame --enable-lib-libvpx --enable-lib-libwebp
                --enable-lib-srt
              )
              ;;
            audio-video)
              EXTRA+=(
                --enable-lib-openssl --enable-lib-dav1d --enable-lib-opus
                --enable-lib-lame --enable-lib-libvpx --enable-lib-libwebp
                --enable-lib-soxr --enable-lib-srt --enable-lib-libvorbis
                --enable-lib-libtheora --enable-lib-speex --enable-lib-opencore-amr
                --enable-lib-libass --enable-lib-freetype --enable-lib-fribidi
                --enable-lib-harfbuzz --enable-lib-fontconfig --enable-lib-libxml2
                --enable-lib-zimg
              )
              ;;
            full)
              # Every non-GPL external library. gnutls must be disabled because
              # FFmpeg refuses to configure with both GnuTLS and OpenSSL; OpenSSL stays.
              EXTRA+=( --enable-lib-all --disable-lib-gnutls )
              ;;
            full-gpl)
              # Everything above + GPL libs (x264, x265, xvidcore, libvidstab, rubberband).
              # The resulting binaries are licensed under GPL v3.
              EXTRA+=( --enable-gpl --enable-lib-all --disable-lib-gnutls )
              ;;
            *) echo "Unknown variant: $VARIANT"; exit 1 ;;
          esac

          FLAGS=(
            --xcframework --spm
            --target="$IOS_MIN"
            --jobs="$(sysctl -n hw.ncpu)"
            "${ARCH_FLAGS[@]}" "${IOS_LIBS[@]}" ${EXTRA[@]+"${EXTRA[@]}"}
          )
          printf '%s\n' "${FLAGS[@]}" > "$GITHUB_WORKSPACE/ios-flags.txt"
          printf '  %s\n' "${FLAGS[@]}"

          {
            echo "### ios.sh flags (variant: \`$VARIANT\`)"
            echo '```'
            printf '%s\n' "${FLAGS[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iOS arm64 xcframeworks
        working-directory: ffmpeg-kit-next
        env:
          CI: "true"
        run: |
          set -euo pipefail
          chmod +x ./ios.sh
          FLAGS=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ""|\#*) continue ;;
            esac
            FLAGS+=("$line")
          done < "$GITHUB_WORKSPACE/ios-flags.txt"
          echo "Invoking ios.sh with ${#FLAGS[@]} flags"
          ./ios.sh "${FLAGS[@]}"
          echo "===== prebuilt tree ====="
          find prebuilt -maxdepth 3 -type d | sort
          echo "===== disk after build ====="
          df -h /

      - name: Package dist for apps
        run: |
          set -euo pipefail
          SRC_ROOT="ffmpeg-kit-next/prebuilt"
          DIST="dist/FFmpegKitNext-iOS"
          mkdir -p "$DIST"
          BUNDLE="$(find "$SRC_ROOT" -maxdepth 1 -type d -name 'bundle-apple-xcframework-ios-*' | head -n 1)"
          if [[ -z "$BUNDLE" ]]; then
            echo "No bundle-apple-xcframework-ios-* under $SRC_ROOT"
            ls -la "$SRC_ROOT" || true
            exit 1
          fi
          cp -R "$BUNDLE"/. "$DIST/"
          cp "$GITHUB_WORKSPACE/ios-flags.txt" dist/ios-flags.txt
          if [[ -f ffmpeg-kit-next/build.log ]]; then
            gzip -c ffmpeg-kit-next/build.log > dist/build.log.gz
          fi
          du -sh "$DIST"/* || true

      - name: Upload iOS xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-device-${{ inputs.variant }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-ios-device-${{ inputs.variant }}-buildlog
          path: ffmpeg-kit-next/build.log
          if-no-files-found: ignore
          retention-days: 14
